<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLLABAI - Minimalist Matrix</title>
    <style>
        /* Base Theme (Dark Mode) */
        :root {
            --bg-color: #050505; 
            --header-border: #1f1f1f;
            --text-primary: #ffffff;
            --text-secondary: #888888;
            --user-bubble: #27272a;
            --input-bg: #18181b;
            --send-btn: #3f3f46;
            --accent-color: #00ffaa;
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --canvas-bg: #111111;
            --sidebar-bg: #09090b;
            --sidebar-hover: #18181b;
        }

        /* Light Mode Overrides */
        body.light-mode {
            --bg-color: #ffffff;
            --header-border: #eaeaea;
            --text-primary: #000000;
            --text-secondary: #71717a;
            --user-bubble: #f4f4f5;
            --input-bg: #f4f4f5;
            --send-btn: #e4e4e7;
            --accent-color: #059669;
            --canvas-bg: #ffffff;
            --sidebar-bg: #f8fafc;
            --sidebar-hover: #e2e8f0;
        }

        body, html {
            margin: 0; padding: 0; font-family: var(--font-family);
            background-color: var(--bg-color); color: var(--text-primary);
            height: 100vh; width: 100vw; display: flex; overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--header-border);
            display: flex; flex-direction: column; transition: transform 0.3s ease, background-color 0.3s ease;
            position: relative; z-index: 20; flex-shrink: 0;
        }
        .sidebar.closed { transform: translateX(-100%); position: absolute; height: 100%; }

        .new-chat-btn {
            margin: 16px; padding: 12px; background: transparent; border: 1px solid var(--header-border);
            color: var(--text-primary); border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; font-family: inherit; font-size: 0.95rem;
            transition: background 0.2s ease;
        }
        .new-chat-btn:hover { background: var(--sidebar-hover); }

        .chat-list { flex: 1; overflow-y: auto; padding: 0 8px; }
        .chat-item {
            padding: 12px 16px; margin-bottom: 4px; border-radius: 8px; cursor: pointer;
            color: var(--text-secondary); font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .chat-item:hover, .chat-item.active { background: var(--sidebar-hover); color: var(--text-primary); }

        /* --- MAIN CONTENT --- */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; min-width: 0; }

        /* --- HEADER --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 24px; border-bottom: 1px solid var(--header-border); z-index: 10;
        }
        
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-toggle {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; display: flex; padding: 4px; transition: color 0.2s ease;
        }
        .menu-toggle:hover { color: var(--text-primary); }
        .header-left h2 { margin: 0; font-size: 1.2rem; font-weight: 700; letter-spacing: 0.5px; }
        .header-left h2 span { color: var(--accent-color); }
        
        .header-right { display: flex; align-items: center; gap: 20px; }
        .theme-toggle {
            background: transparent; border: none; color: var(--text-secondary);
            cursor: pointer; display: flex; padding: 8px; border-radius: 8px; transition: color 0.2s ease;
        }
        .theme-toggle:hover { color: var(--text-primary); background: var(--sidebar-hover); }

        .bot-container { display: flex; align-items: center; position: relative; }
        canvas { 
            background-color: var(--canvas-bg); border-radius: 50%; border: 2px solid var(--accent-color); 
            box-shadow: 0 0 15px rgba(0, 255, 170, 0.1); cursor: pointer; transition: transform 0.1s ease;
        }
        canvas:active { transform: scale(0.90); }

        .poke-bubble {
            position: absolute; right: 65px; top: 10px; background: var(--accent-color); color: #000;
            font-size: 0.8rem; font-weight: 700; padding: 6px 12px; border-radius: 8px; border-bottom-right-radius: 0;
            opacity: 0; transform: scale(0.8); pointer-events: none; transition: opacity 0.2s ease; z-index: 20;
        }
        .poke-bubble.show { opacity: 1; transform: scale(1); }

        /* --- CHAT AREA --- */
        .chat-container { 
            flex: 1; overflow-y: auto; padding: 40px 15%; 
            display: flex; flex-direction: column; scroll-behavior: smooth; gap: 32px;
        }
        
        .message-row { display: flex; flex-direction: column; width: 100%; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .message-row.user { align-items: flex-end; }
        .message-row.bot { align-items: flex-start; }

        .user-content {
            background-color: var(--user-bubble); color: var(--text-primary);
            padding: 14px 20px; border-radius: 24px; font-size: 1rem;
            max-width: 70%; line-height: 1.5;
        }

        .bot-content { font-size: 1.15rem; line-height: 1.6; max-width: 85%; color: var(--text-primary); width: 100%; }
        .bot-content p { margin: 0 0 16px 0; }
        .bot-content p:last-child { margin-bottom: 0; }
        .bot-content strong { font-weight: 700; color: var(--accent-color); }

        .code-wrapper { background: var(--input-bg); border: 1px solid var(--header-border); border-radius: 12px; margin: 16px 0; overflow: hidden; font-family: monospace; width: 100%; }
        .code-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: rgba(0, 0, 0, 0.2); border-bottom: 1px solid var(--header-border); font-size: 0.8rem; color: var(--text-secondary); }
        .light-mode .code-header { background: rgba(0, 0, 0, 0.05); }
        .code-copy-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; }
        .code-copy-btn:hover { color: var(--text-primary); }
        .code-copy-btn.active { color: var(--accent-color); }
        .code-wrapper pre { margin: 0; padding: 16px; overflow-x: auto; color: var(--text-primary); font-size: 0.95rem; line-height: 1.5; }

        .action-tray { display: flex; gap: 16px; margin-top: 12px; }
        .action-btn { background: transparent; border: none; color: var(--text-secondary); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 0; font-family: inherit; font-weight: 500; }
        .action-btn:hover { color: var(--text-primary); }
        .action-btn.active { color: var(--accent-color); }

        /* --- INPUT AREA --- */
        .input-area { padding: 20px 15% 40px 15%; background: transparent; }
        .input-box { display: flex; background: var(--input-bg); border-radius: 32px; padding: 8px 8px 8px 16px; align-items: center; gap: 12px; }
        .input-box input[type="text"] { flex: 1; background: none; border: none; color: var(--text-primary); outline: none; font-size: 1rem; font-family: inherit; padding-left: 8px;}
        .input-box input[type="text"]::placeholder { color: var(--text-secondary); }
        .send-btn { background: var(--send-btn); border: none; color: var(--text-secondary); cursor: pointer; padding: 10px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: var(--text-primary); color: var(--bg-color); }
        
        .attach-btn { background: transparent; border: none; color: var(--text-secondary); cursor: pointer; padding: 8px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: color 0.2s; }
        .attach-btn:hover { color: var(--text-primary); }

        @media (max-width: 768px) { 
            .chat-container, .input-area { padding-left: 5%; padding-right: 5%; }
            .sidebar { position: absolute; height: 100%; box-shadow: 5px 0 15px rgba(0,0,0,0.5); }
        }
    </style>
</head>
<body>

    <div class="sidebar closed" id="sidebar">
        <button class="new-chat-btn" id="newChatBtn">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            New Session
        </button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="24" width="24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <h2>COLLAB<span>AI</span></h2>
            </div>
            
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="Toggle Light/Dark Mode">
                    <svg id="themeIcon" stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
                <div class="bot-container">
                    <div class="poke-bubble" id="pokeBubble">Nailed it!</div>
                    <canvas id="botCanvas" width="50" height="50" title="Click to poke me"></canvas>
                </div>
            </div>
        </div>

        <div class="chat-container" id="chatContainer"></div>

        <div class="input-area">
            <div class="input-box">
                <input type="file" id="fileInput" style="display: none;" accept=".txt,.pdf,.csv,.md,.py,.js,.html">
                <button class="attach-btn" id="attachBtn" title="Attach File">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="20" width="20"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                </button>
                
                <input type="text" id="userInput" placeholder="Message CollabAI..." autocomplete="off">
                
                <button class="send-btn" id="sendBtn">
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Sidebar & Session Management ---
        const sidebar = document.getElementById('sidebar');
        const menuToggle = document.getElementById('menuToggle');
        const newChatBtn = document.getElementById('newChatBtn');
        const chatList = document.getElementById('chatList');
        const chatContainer = document.getElementById('chatContainer');
        
        let currentSessionId = localStorage.getItem('active_session');
        let savedChats = [];
        
        try { savedChats = JSON.parse(localStorage.getItem('vibey_chats')) || []; } catch(e) { savedChats = []; }

        menuToggle.addEventListener('click', () => { sidebar.classList.toggle('closed'); });

        function renderChatList() {
            chatList.innerHTML = '';
            savedChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentSessionId ? 'active' : ''}`;
                div.innerText = chat.title;
                div.onclick = () => loadSession(chat.id);
                chatList.appendChild(div);
            });
        }

        function createNewSession() {
            currentSessionId = 'session_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('active_session', currentSessionId);
            savedChats.unshift({ id: currentSessionId, title: 'New Conversation' });
            localStorage.setItem('vibey_chats', JSON.stringify(savedChats));
            chatContainer.innerHTML = ''; 
            
            addMessage('bot', 'Systems optimized. Matrix secured. Ready when you are.', 'idle', true);

            renderChatList();
            if (window.innerWidth <= 768) sidebar.classList.add('closed');
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            localStorage.setItem('active_session', currentSessionId);
            renderChatList();
            chatContainer.innerHTML = '';
            if (window.innerWidth <= 768) sidebar.classList.add('closed');

            try {
                const response = await fetch(`http://127.0.0.1:8000/api/history/${sessionId}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.history && data.history.length > 0) {
                        data.history.forEach(msg => {
                            addMessage(msg.role === 'assistant' ? 'bot' : 'user', msg.content, 'idle', true);
                        });
                    } else {
                        addMessage('bot', 'Systems optimized. Matrix secured. Ready when you are.', 'idle', true);
                    }
                }
            } catch (err) {
                console.error("Failed to load history.");
                addMessage('bot', 'Local history loaded. Connection to backend server is offline.', 'idle', true);
            }
        }

        newChatBtn.addEventListener('click', createNewSession);

        if (!currentSessionId || savedChats.length === 0) {
            createNewSession();
        } else {
            loadSession(currentSessionId);
        }

        // --- Theme Toggle ---
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        let isDarkMode = true;
        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('light-mode', !isDarkMode);
            themeIcon.innerHTML = isDarkMode 
                ? `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>` 
                : `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
        });

        // --- Core Application & Canvas ---
        let botState = 'idle'; 
        let isSpeaking = false;
        const wittyRemarks = ["Stop pushing my buttons.", "I'm literally compiling rn.", "Vibe check passed.", "Don't touch the avatar."];

        function playTargetText(textId, buttonId, postEmotion) {
            const targetDiv = document.getElementById(textId);
            const btn = document.getElementById(buttonId);
            const btnText = btn.querySelector('span');

            if (window.speechSynthesis.speaking && isSpeaking && btn.classList.contains('active')) {
                window.speechSynthesis.cancel(); isSpeaking = false; btn.classList.remove('active'); btnText.innerText = 'Listen'; botState = postEmotion; return;
            }

            window.speechSynthesis.cancel(); 
            const rawText = targetDiv.innerText || targetDiv.textContent;
            const cleanText = rawText.replace(/[\u{1F600}-\u{1F6FF}]/gu, '').replace(/\*/g, '');
            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.05; utterance.pitch = 0.95;
            utterance.onstart = () => { isSpeaking = true; btn.classList.add('active'); btnText.innerText = 'Playing...'; };
            utterance.onend = () => { isSpeaking = false; btn.classList.remove('active'); btnText.innerText = 'Listen'; botState = postEmotion; };
            window.speechSynthesis.speak(utterance);
        }

        const canvas = document.getElementById('botCanvas');
        const ctx = canvas.getContext('2d');
        let time = 0;

        function drawBot() {
            ctx.clearRect(0, 0, 50, 50);
            const primaryColor = botState === 'thinking' ? '#ffcc00' : (isDarkMode ? '#00ffaa' : '#059669');
            canvas.style.borderColor = primaryColor;
            
            ctx.strokeStyle = primaryColor; ctx.fillStyle = primaryColor; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
            ctx.beginPath(); ctx.arc(25, 25, 15, 0, Math.PI * 2); ctx.stroke();
            time += 0.08;

            if (botState === 'thinking') {
                const eyeOffset = Math.sin(time * 2) * 2;
                ctx.fillRect(18 + eyeOffset, 18, 4, 4); ctx.fillRect(28 + eyeOffset, 18, 4, 4);
                ctx.beginPath();
                for(let i = 0; i <= 12; i++) {
                    const x = 19 + i; const y = 31 + Math.sin(time * 4 + i * 0.8) * 2;
                    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                }
                ctx.stroke();
            } else {
                if (botState === 'happy') {
                    ctx.beginPath(); ctx.arc(20, 19, 3, Math.PI, 0); ctx.stroke(); ctx.beginPath(); ctx.arc(30, 19, 3, Math.PI, 0); ctx.stroke();
                } else {
                    const isBlinking = Math.sin(time) > 0.95; const eyeSize = isBlinking ? 1 : 4;
                    ctx.fillRect(18, 20 - (eyeSize/2), 4, eyeSize); ctx.fillRect(28, 20 - (eyeSize/2), 4, eyeSize);
                }
                if (isSpeaking) {
                    const mouthOpen = Math.abs(Math.sin(time * 8)) * 6;
                    ctx.beginPath(); ctx.ellipse(25, 32, 6, 1 + mouthOpen, 0, 0, Math.PI * 2); ctx.fill();
                } else {
                    if (botState === 'happy') { ctx.beginPath(); ctx.arc(25, 28, 6, 0.1, Math.PI - 0.1); ctx.stroke(); } 
                    else { ctx.beginPath(); ctx.moveTo(19, 30); ctx.lineTo(31, 30); ctx.stroke(); }
                }
            }
            requestAnimationFrame(drawBot);
        }
        drawBot();

        const pokeBubble = document.getElementById('pokeBubble');
        canvas.addEventListener('click', () => {
            pokeBubble.innerText = wittyRemarks[Math.floor(Math.random() * wittyRemarks.length)]; 
            pokeBubble.classList.add('show');
            setTimeout(() => { pokeBubble.classList.remove('show'); }, 1800);
        });

        function scrollToBottom() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }
        function escapeHTML(str) { return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

        function addMessage(sender, text, rawEmotion = 'idle', isHistory = false) {
            const div = document.createElement('div');
            div.className = `message-row ${sender}`;
            const msgId = 'msg_' + Math.random().toString(36).substr(2, 9);
            
            if (sender === 'user') {
                div.innerHTML = `<div class="user-content">${text}</div>`;
                
                if (!isHistory) {
                    const activeChat = savedChats.find(c => c.id === currentSessionId);
                    if (activeChat && activeChat.title === 'New Conversation') {
                        activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
                        localStorage.setItem('vibey_chats', JSON.stringify(savedChats));
                        renderChatList();
                    }
                }
            } else {
                const normalizedEmotion = (rawEmotion || 'idle').toLowerCase().trim();
                const postEmotionState = normalizedEmotion === 'happy' ? 'happy' : 'idle';
                let formattedText = text; const codeBlocks = [];

                formattedText = formattedText.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    const codeId = 'code_' + Math.random().toString(36).substr(2, 9);
                    codeBlocks.push({ id: codeId, lang: lang || 'code', code: code.trim() });
                    return `\n___CODE_BLOCK_${codeBlocks.length - 1}___\n`;
                });

                formattedText = formattedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                
                let lines = formattedText.split(/\n+/);
                let contentHTML = lines.map(line => {
                    let trimmed = line.trim(); if (!trimmed) return '';
                    const codeMatch = trimmed.match(/^___CODE_BLOCK_(\d+)___$/);
                    if (codeMatch) {
                        const block = codeBlocks[codeMatch[1]];
                        return `
                            <div class="code-wrapper">
                                <div class="code-header"><span style="text-transform: uppercase; font-weight: bold;">${block.lang}</span><button class="code-copy-btn" onclick="copySpecificCode('${block.id}', this)"><svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="14" width="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Copy Code</span></button></div>
                                <pre><code id="${block.id}">${escapeHTML(block.code)}</code></pre>
                            </div>
                        `;
                    }
                    if (trimmed.match(/^\d+\./) || trimmed.startsWith('-') || trimmed.startsWith('•')) { return `<div style="margin-bottom: 12px; padding-left: 12px; border-left: 2px solid var(--accent-color);">${trimmed}</div>`; }
                    return `<p>${trimmed}</p>`;
                }).join('');

                div.innerHTML = `
                    <div class="bot-content" id="${msgId}">${contentHTML}</div>
                    <div class="action-tray">
                        <button class="action-btn" onclick="copyMessageText('${msgId}')" id="cp_${msgId}"><svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="14" width="14"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span>Copy All</span></button>
                        <button class="action-btn" onclick="playTargetText('${msgId}', 'aud_${msgId}', '${postEmotionState}')" id="aud_${msgId}"><svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="14" width="14"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg><span>Listen</span></button>
                    </div>
                `;
            }

            chatContainer.appendChild(div);
            scrollToBottom();
        }

        function copySpecificCode(codeId, btn) {
            const codeEl = document.getElementById(codeId); const span = btn.querySelector('span');
            navigator.clipboard.writeText(codeEl.innerText).then(() => { btn.classList.add('active'); span.innerText = 'Copied!'; setTimeout(() => { btn.classList.remove('active'); span.innerText = 'Copy Code'; }, 2000); });
        }
        function copyMessageText(msgId) {
            const targetDiv = document.getElementById(msgId); const btn = document.getElementById('cp_' + msgId); const btnText = btn.querySelector('span');
            navigator.clipboard.writeText(targetDiv.innerText || targetDiv.textContent).then(() => { btn.classList.add('active'); btnText.innerText = 'Copied!'; setTimeout(() => { btn.classList.remove('active'); btnText.innerText = 'Copy All'; }, 2000); });
        }

        // --- NEW FILE UPLOAD LOGIC ---
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        let attachedFileContent = "";

        // Clicking the paperclip opens the file browser
        attachBtn.addEventListener('click', () => fileInput.click());

        // When a file is chosen, send it to the backend to be read
        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            addMessage('bot', `Reading **${file.name}**...`, 'thinking');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('http://127.0.0.1:8000/api/upload', {
                    method: 'POST',
                    body: formData
                });
                if (!res.ok) throw new Error("File upload failed");
                const data = await res.json();
                
                // Store the text silently so it gets attached to your next message
                attachedFileContent = `\n\n[USER ATTACHED FILE: ${data.filename}]\n${data.content}`;
                addMessage('bot', `I've successfully extracted the text from **${data.filename}**. What do you want me to do with it?`, 'happy');
            } catch (err) {
                addMessage('bot', `Failed to read file: ${err.message}`, 'idle');
            }
            fileInput.value = ''; // Reset input
        });

        async function handleSend() {
            const text = input.value.trim(); 
            // Allow sending if there is text OR an attached file waiting
            if (!text && !attachedFileContent) return; 

            // Combine text and file data, but only show the user's actual text in the chat bubble
            const finalPrompt = text + attachedFileContent;
            const displayPrompt = text ? text : "(Uploaded a file)";
            
            addMessage('user', displayPrompt); 
            input.value = ''; 
            botState = 'thinking';
            
            // Clear the attached file memory immediately so it doesn't send repeatedly
            attachedFileContent = "";

            try {
                const response = await fetch('http://127.0.0.1:8000/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: finalPrompt, session_id: currentSessionId })
                });
                if (!response.ok) throw new Error("Crashed");
                const data = await response.json();
                
                addMessage('bot', data.reply, data.emotion);
                const receivedEmotion = (data.emotion || 'idle').toLowerCase().trim();
                botState = receivedEmotion === 'happy' ? 'happy' : 'idle';
            } catch (err) {
                addMessage('bot', 'Connection error to local Python backend engine.', 'idle');
                botState = 'idle';
            }
        }

        sendBtn.addEventListener('click', handleSend);
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });
        input.focus();
    </script>
</body>
</html>
